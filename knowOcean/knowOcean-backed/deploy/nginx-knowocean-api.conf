# ── KnowOcean Python Backend ── Nginx 反向代理
# 放在 /etc/nginx/sites-available/knowocean-api 并软链到 sites-enabled
#
# 测试配置: nginx -t
# 重载:      nginx -s reload

upstream knowocean_backend {
    # 如有多实例可添加更多 server 行
    server 127.0.0.1:10001 weight=1 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name api.your-domain.com;

    # 如已配置 HTTPS 证书，取消注释以下行
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/api.your-domain.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/api.your-domain.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # 客户端上传文件大小限制
    client_max_body_size 200M;

    # 日志
    access_log /var/log/nginx/knowocean-api-access.log;
    error_log  /var/log/nginx/knowocean-api-error.log;

    # ── API 代理 ──
    location /api/ {
        proxy_pass http://knowocean_backend;
        proxy_http_version 1.1;

        # 基础头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持 (QA 流式回答)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # 大响应体
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ── 健康检查 (不记录日志) ──
    location /health {
        proxy_pass http://knowocean_backend;
        access_log off;
    }

    # ── Prometheus 指标 (预留) ──
    # location /metrics {
    #     proxy_pass http://knowocean_backend;
    #     access_log off;
    #     allow 10.0.0.0/8;
    #     deny all;
    # }

    # ── 安全头 ──
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}
