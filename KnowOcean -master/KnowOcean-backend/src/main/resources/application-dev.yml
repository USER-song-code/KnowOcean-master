project:
  name: KnowOcean-backend
  version: 1.0.0

server:
  port: 10001

spring:
  application:
    name: KnowOcean-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:139.224.230.121}:${DB_PORT:5432}/${DB_NAME:dd_rag}
    username: ${DB_USERNAME:dd_rag}
    password: ${DB_PASSWORD:dd_rag}
    driver-class-name: org.postgresql.Driver

  # ──────────────────────────────────────────────
  # Spring AI Alibaba — DashScope 原生配置
  # ──────────────────────────────────────────────
  ai:
    model:
      chat: dashscope
      embedding: openai
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-389dcbf5dbca4f4ba8e39f33a7c66ca6}
      chat:
        options:
          model: deepseek-v4-pro
    openai:
      api-key: ${OPENAI_API_KEY:sk-389dcbf5dbca4f4ba8e39f33a7c66ca6}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      embedding:
        options:
          # 指定维度，确保与数据库表结构一致
          dimensions: 512
          model: text-embedding-v3
          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
          truncate: true

    # 下面是 Ollama 相关配置，使用的话需要自己部署ollama对应的向量模型，然后放开spring-ai-starter-model-ollama，注释掉spring-ai-starter-model-openai
    #    model:
    #      chat: dashscope
    #      embedding: ollama
    #    dashscope:
    #      api-key: ${DASHSCOPE_API_KEY:}
    #      chat:
    #        options:
    #          model: glm-5
    #    ollama:
    #      base-url: http://localhost:11434
    #      embedding:
    #        options:
    #          model: qllama/bge-small-zh-v1.5
    #          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
    #          truncate: true



    # PGvector 向量存储（复用已有 PostgreSQL）
    vectorstore:
      pgvector:
        dimensions: 512
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: false   # 🔥 加上这一行！自动创建表

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://139.224.230.121:19000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:knowocean-rag-documents}

rag:
  auth:
    jwt-secret: ${DD_RAG_JWT_SECRET:KnowOcean-rag-jwt-secret-key-2026-may-24-bytes}
    issuer: KnowOcean-rag
    access-token-expire-minutes: 30
    refresh-token-expire-days: 14
    # 仅开发环境兜底，生产环境仍应显式配置安全密钥。
    #    jwt-secret: ${DD_RAG_JWT_SECRET:KnowOcean_rag-dev-jwt-secret-2026-04-20-32bytes}
    refresh-cookie-name: KnowOcean_DD_RAG_REFRESH_TOKEN
    refresh-cookie-secure: false
  dev-admin:
    username: ${DD_RAG_DEV_ADMIN_USERNAME:admin}
    email: ${DD_RAG_DEV_ADMIN_EMAIL:admin@KnowOcean.local}
    display-name: ${DD_RAG_DEV_ADMIN_DISPLAY_NAME:系统管理员}
    password: ${DD_RAG_DEV_ADMIN_PASSWORD:Admin123456}
    user-code: ${DD_RAG_DEV_ADMIN_USER_CODE:ADMIN001}

elasticsearch:
  host: ${ES_HOST:139.224.230.121}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  username: ${ES_USERNAME:elastic}
  password: ${ES_PASSWORD:elastic}
  index-name: dd_rag_document_chunks

ingestion:
  chunking:
    target-tokens: 240
    max-tokens: 320
    overlap-tokens: 32
  vector:
    # 控制业务侧每次调用 VectorStore.add 的 chunk 数量，降低单次 Ollama embedding 请求压力。
    add-batch-size: 9
